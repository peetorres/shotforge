<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shotforge — Refine: All Slides + Center Inspector</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #111113; --surface-2: #1c1c1e; --surface-3: #27272a; --surface-4: #3f3f46;
    --text: #fafafa; --text-2: #a1a1aa; --text-3: #52525b; --text-4: #71717a;
    --indigo: #6366f1; --purple: #8b5cf6; --green: #22c55e; --orange: #f59e0b;
    --red: #ef4444; --pink: #ec4899; --blue: #3b82f6; --cyan: #06b6d4;
    --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
  input, textarea, select { font-family: var(--font); outline: none; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 2px; }

  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ═══ LAYOUT ═══════════════════════════════════════
     topbar
     slides-row (all slides + inspector between them)
     ═══════════════════════════════════════════════════ */
  .app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ─── Top Bar ──────────────────────────────────── */
  .topbar {
    height: 48px; flex-shrink: 0;
    background: rgba(17,17,19,0.92); backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; padding: 0 16px; gap: 10px; z-index: 50;
  }
  .tb-brand { font-size: 14px; font-weight: 800; background: linear-gradient(135deg, var(--indigo), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tb-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.06); }
  .tb-back { height: 28px; padding: 0 10px; border-radius: 7px; background: var(--surface-2); color: var(--text-3); font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 3px; transition: all 0.12s; }
  .tb-back:hover { background: var(--surface-3); color: var(--text-2); }

  .tb-tabs { display: flex; gap: 0; background: var(--surface-2); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); }
  .tb-tab { padding: 5px 14px; font-size: 11px; font-weight: 600; color: var(--text-3); transition: all 0.12s; }
  .tb-tab:hover { color: var(--text-2); }
  .tb-tab.active { background: var(--surface-3); color: var(--text); }

  .tb-spacer { flex: 1; }

  .tb-device { height: 28px; padding: 0 10px; border-radius: 7px; background: var(--indigo); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .tb-export { height: 28px; padding: 0 12px; border-radius: 7px; background: var(--green); color: #000; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all 0.12s; }
  .tb-export:hover { background: #34d058; }

  /* ─── Main Area: Slides + Inspector ────────────── */
  .main-area {
    flex: 1; display: flex; overflow: hidden;
    padding: 16px 0;
  }

  /* Scrollable slides container */
  .slides-scroll {
    flex: 1; display: flex; align-items: stretch;
    overflow-x: auto; overflow-y: hidden;
    gap: 14px; padding: 0 20px;
    scroll-snap-type: x proximity;
    scroll-behavior: smooth;
  }

  /* ─── Individual Slide Card ────────────────────── */
  .slide-card {
    flex-shrink: 0;
    width: calc((100vh - 48px - 32px) * (1290 / 2796));
    /* height fills parent */
    border-radius: 20px;
    overflow: hidden; position: relative;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.25s var(--ease-out);
    scroll-snap-align: center;
  }
  .slide-card:hover {
    border-color: rgba(255,255,255,0.08);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .slide-card.selected {
    border-color: var(--indigo);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.12), 0 16px 48px rgba(99,102,241,0.1);
    transform: translateY(-4px);
  }

  /* Slide number */
  .slide-num {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    width: 24px; height: 24px; border-radius: 7px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    font-size: 11px; font-weight: 800; color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
  }
  .slide-card.selected .slide-num { background: var(--indigo); color: #fff; }

  /* Slide type badge */
  .slide-type-badge {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    padding: 3px 8px; border-radius: 5px;
    font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); color: var(--text-2);
  }

  /* Slide inner content */
  .slide-inner {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 11% 8% 0; position: relative; overflow: hidden;
  }
  .slide-inner .si-hl {
    font-size: clamp(10px, 1.4vw, 16px); font-weight: 800;
    text-align: center; line-height: 1.15; letter-spacing: -0.3px;
    margin-bottom: 5%; z-index: 2;
  }
  .slide-inner .si-dev {
    width: 55%; aspect-ratio: 9/19.5;
    border-radius: clamp(6px, 0.8vw, 12px);
    overflow: hidden; z-index: 2;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    border: 1.5px solid rgba(255,255,255,0.06);
  }
  .slide-inner .si-dev .mock {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(12px, 1.5vw, 22px);
  }
  .slide-inner .si-glow {
    position: absolute; width: 130%; height: 60%;
    bottom: -5%; left: -15%; border-radius: 50%;
    filter: blur(50px); opacity: 0.18; z-index: 1;
  }

  /* ─── Inspector Panel (between slides) ─────────── */
  .inspector-panel {
    flex-shrink: 0; width: 260px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    overflow-y: auto; overflow-x: hidden;
    display: none; /* hidden until a slide is selected */
    animation: scaleIn 0.25s var(--ease);
    scroll-snap-align: center;
    margin: 0 4px;
  }
  .inspector-panel.visible { display: block; }

  /* Inspector toolbar */
  .ins-toolbar {
    display: flex; gap: 3px; padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    flex-wrap: wrap;
  }
  .ins-tool {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface-2); color: var(--text-3);
    font-size: 13px; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
  }
  .ins-tool:hover { background: var(--surface-3); color: var(--text-2); }
  .ins-tool.primary { background: var(--indigo); color: #fff; }
  .ins-tool.danger { color: var(--red); }

  /* Inspector accordion sections */
  .ins-section { border-bottom: 1px solid rgba(255,255,255,0.04); }
  .ins-section-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; cursor: pointer;
    transition: all 0.1s;
  }
  .ins-section-header:hover { background: rgba(255,255,255,0.02); }
  .ins-section-icon { font-size: 14px; width: 20px; text-align: center; }
  .ins-section-name { font-size: 12px; font-weight: 600; flex: 1; }
  .ins-section-actions { display: flex; gap: 2px; }
  .ins-action {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--surface-2); color: var(--text-3);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
  }
  .ins-action:hover { background: var(--surface-3); color: var(--text-2); }
  .ins-action.active { background: var(--indigo); color: #fff; }
  .ins-chevron { font-size: 10px; color: var(--text-4); transition: transform 0.2s; }
  .ins-section.open .ins-chevron { transform: rotate(180deg); }

  .ins-section-body { padding: 0 12px 12px; display: none; }
  .ins-section.open .ins-section-body { display: block; }

  /* Inspector inputs */
  .ins-label { font-size: 10px; color: var(--text-4); margin-bottom: 4px; display: block; font-weight: 500; }
  .ins-inp {
    width: 100%; background: var(--bg);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 6px;
    padding: 7px 10px; font-size: 12px; color: var(--text);
    transition: all 0.1s; margin-bottom: 6px;
  }
  .ins-inp:focus { border-color: var(--indigo); }

  .ins-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .ins-bg {
    aspect-ratio: 1; border-radius: 5px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.1s;
  }
  .ins-bg:hover { transform: scale(1.06); }
  .ins-bg.active { border-color: #fff; }

  .ins-colors { display: flex; gap: 4px; flex-wrap: wrap; }
  .ins-c {
    width: 20px; height: 20px; border-radius: 5px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.1s;
  }
  .ins-c:hover { transform: scale(1.1); }
  .ins-c.active { border-color: #fff; }

  .ins-select {
    width: 100%; background: var(--bg);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 6px;
    padding: 6px 10px; font-size: 11px; color: var(--text); appearance: none;
  }

  .ins-slider { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ins-slider input[type="range"] { flex: 1; accent-color: var(--indigo); height: 2px; }
  .ins-slider .val { font-size: 9px; color: var(--text-4); min-width: 26px; text-align: right; font-family: 'SF Mono', monospace; }

  /* Subtitle under section name */
  .ins-section-sub { font-size: 9px; color: var(--text-4); margin-left: 28px; margin-top: -6px; padding-bottom: 4px; }
</style>
</head>
<body>

<div class="app">
  <!-- ═══ TOP BAR ════════════════════════════════════ -->
  <div class="topbar">
    <div class="tb-brand">Shotforge</div>
    <div class="tb-sep"></div>
    <button class="tb-back">← Variants</button>

    <div class="tb-tabs">
      <div class="tb-tab">Setup</div>
      <div class="tb-tab active">Background</div>
      <div class="tb-tab">Localize</div>
      <div class="tb-tab">App Screens</div>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-device">iPhone 6.7" ▾</div>
    <button class="tb-export">⬇ Export</button>
  </div>

  <!-- ═══ MAIN: SLIDES + INSPECTOR ═══════════════════ -->
  <div class="main-area">
    <div class="slides-scroll" id="slides-scroll">
      <!-- Slides and inspector injected here by JS -->
    </div>
  </div>
</div>

<script>
// ─── Config ─────────────────────────────────────
const COLOR_DEFAULT = '#6366f1';
const COLORS = ['#6366f1','#3b82f6','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#8b5cf6'];
const BGS = [
  { bg: 'linear-gradient(160deg,#0D0D18,#1a1033)', text: '#fff', mockBg: '#1c1c1e', mockC: '#555' },
  { bg: 'linear-gradient(160deg,#F5F5F7,#E8E8ED)', text: '#1d1d1f', mockBg: '#e5e5ea', mockC: '#888' },
  { bg: null, text: '#fff', mockBg: '#1c1c1e', mockC: '#555' },
  { bg: 'linear-gradient(160deg,#000,#0a0a1a)', text: '#fff', mockBg: '#111', mockC: '#444' },
  { bg: 'linear-gradient(135deg,#667eea,#764ba2)', text: '#fff', mockBg: '#2d2060', mockC: '#8875c0' },
  { bg: 'linear-gradient(135deg,#f093fb,#f5576c)', text: '#fff', mockBg: '#4a1030', mockC: '#c06080' },
  { bg: 'linear-gradient(135deg,#4facfe,#00f2fe)', text: '#fff', mockBg: '#0a2a4a', mockC: '#4090c0' },
  { bg: 'linear-gradient(135deg,#43e97b,#38f9d7)', text: '#1d1d1f', mockBg: '#d0f0e0', mockC: '#5a9' },
];
const HEADLINES = [
  'Your app,\n**elevated**',
  '**Smart** learning\nmade simple',
  'Track your\n**progress**',
  'AI-powered\n**insights**',
  'Daily\n**challenges**',
  'Join **thousands**\nof learners',
];
const TYPES = ['Hero','Feature','Feature','Feature','Feature','Social'];
const PLACEHOLDERS = ['📊','🏠','👤','⚡','📱','🎯'];

// ─── State ──────────────────────────────────────
let st = { selected: 0, color: COLOR_DEFAULT, bgIdx: 0, openSections: { layout: false, bg: true, title: true, device: true, title2: false } };

function getBg() {
  const b = BGS[st.bgIdx];
  return b.bg || `linear-gradient(160deg, ${st.color}22, ${st.color}55, #0D0D18)`;
}
function tc() { return BGS[st.bgIdx].text; }
function mb() { return BGS[st.bgIdx].mockBg; }
function mc() { return BGS[st.bgIdx].mockC; }
function hl(text) { return text.replace(/\*\*(.+?)\*\*/g, `<span style="color:${st.color}">$1</span>`).replace(/\n/g, '<br>'); }

// ─── Render ─────────────────────────────────────
function render() {
  const container = document.getElementById('slides-scroll');
  container.innerHTML = '';
  const bg = getBg();

  for (let i = 0; i < 6; i++) {
    // Slide card
    const card = document.createElement('div');
    card.className = `slide-card ${i === st.selected ? 'selected' : ''}`;
    card.style.background = bg;
    card.onclick = () => { st.selected = i; render(); };

    card.innerHTML = `
      <div class="slide-num">${i + 1}</div>
      <div class="slide-type-badge">${TYPES[i]}</div>
      <div class="slide-inner">
        <div class="si-hl" style="color:${tc()}">${hl(HEADLINES[i])}</div>
        <div class="si-dev">
          <div class="mock" style="background:${mb()};color:${mc()}">${PLACEHOLDERS[i]}</div>
        </div>
        <div class="si-glow" style="background:${st.color}"></div>
      </div>
    `;
    container.appendChild(card);

    // Insert inspector AFTER the selected slide
    if (i === st.selected) {
      container.appendChild(buildInspector());
    }
  }
}

function buildInspector() {
  const panel = document.createElement('div');
  panel.className = 'inspector-panel visible';

  // Toolbar
  let toolbarHTML = `
    <div class="ins-toolbar">
      <button class="ins-tool primary" title="Apply">✓</button>
      <button class="ins-tool" title="Reset">↺</button>
      <button class="ins-tool" title="Duplicate">❐</button>
      <button class="ins-tool" title="Copy style">⬇</button>
      <button class="ins-tool" title="Paste style">📋</button>
      <button class="ins-tool" title="Lock">🔒</button>
      <button class="ins-tool" title="Move">✥</button>
      <button class="ins-tool danger" title="Delete">🗑</button>
    </div>
  `;

  // Sections
  const sections = [
    {
      key: 'layout', icon: '☰', name: 'Layout',
      actions: [{ icon: '+', active: false }],
      body: `
        <span class="ins-label">Type</span>
        <select class="ins-select">
          <option selected>Hero — Title + Device</option>
          <option>Feature Single — Headline + Device</option>
          <option>Feature Dual — Headline + 2 Devices</option>
          <option>Stats — Numbers + Device</option>
        </select>
      `
    },
    {
      key: 'bg', icon: '🖼', name: 'Background',
      actions: [],
      body: `
        <div class="ins-bgs" id="ins-bgs-container"></div>
      `
    },
    {
      key: 'title', icon: 'Tt', name: 'Title',
      sub: `slide ${st.selected + 1}`,
      actions: [
        { icon: '+', active: false },
        { icon: '◑', active: false },
        { icon: '⊡', active: true },
        { icon: '✥', active: false },
      ],
      body: `
        <textarea class="ins-inp" rows="2" style="resize:none">${HEADLINES[st.selected].replace(/\*\*/g, '')}</textarea>
        <span class="ins-label">Font</span>
        <select class="ins-select">
          <option>SF Pro Display</option>
          <option selected>Inter</option>
          <option>Poppins</option>
          <option>Montserrat</option>
          <option>Space Grotesk</option>
        </select>
        <span class="ins-label" style="margin-top:6px">Size</span>
        <div class="ins-slider"><input type="range" min="40" max="100" value="68" /><span class="val">68</span></div>
        <span class="ins-label">Color</span>
        <div class="ins-colors" id="ins-colors-container"></div>
      `
    },
    {
      key: 'device', icon: '📱', name: 'Device',
      sub: `layer 1`,
      actions: [
        { icon: '+', active: false },
        { icon: '◑', active: false },
        { icon: '⊡', active: true },
        { icon: '✥', active: false },
      ],
      body: `
        <span class="ins-label">Screenshot</span>
        <select class="ins-select" id="ins-screenshot">
          ${PLACEHOLDERS.map((p, i) => `<option ${i === st.selected ? 'selected' : ''}>Screen ${i + 1} — ${TYPES[i]}</option>`).join('')}
        </select>
        <span class="ins-label" style="margin-top:6px">Rotation</span>
        <div class="ins-slider"><input type="range" min="-20" max="20" value="0" /><span class="val">0°</span></div>
        <span class="ins-label">Scale</span>
        <div class="ins-slider"><input type="range" min="50" max="130" value="100" /><span class="val">100%</span></div>
        <span class="ins-label">Y Position</span>
        <div class="ins-slider"><input type="range" min="-30" max="30" value="0" /><span class="val">0</span></div>
      `
    },
  ];

  let sectionsHTML = sections.map(s => {
    const isOpen = st.openSections[s.key];
    const actionsHTML = s.actions.map(a =>
      `<button class="ins-action ${a.active ? 'active' : ''}">${a.icon}</button>`
    ).join('');

    return `
      <div class="ins-section ${isOpen ? 'open' : ''}" data-key="${s.key}">
        <div class="ins-section-header" onclick="toggleSection('${s.key}')">
          <span class="ins-section-icon">${s.icon}</span>
          <span class="ins-section-name">${s.name}</span>
          <div class="ins-section-actions">${actionsHTML}</div>
          <span class="ins-chevron">▾</span>
        </div>
        ${s.sub ? `<div class="ins-section-sub">${s.sub}</div>` : ''}
        <div class="ins-section-body">${s.body}</div>
      </div>
    `;
  }).join('');

  panel.innerHTML = toolbarHTML + sectionsHTML;

  // After building, populate dynamic elements
  setTimeout(() => {
    populateBgs();
    populateColors();
    bindSliders();
  }, 0);

  return panel;
}

function toggleSection(key) {
  st.openSections[key] = !st.openSections[key];
  render();
}

function populateBgs() {
  const el = document.getElementById('ins-bgs-container');
  if (!el) return;
  el.innerHTML = '';
  BGS.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = `ins-bg ${i === st.bgIdx ? 'active' : ''}`;
    d.style.background = b.bg || `linear-gradient(160deg, ${st.color}33, ${st.color}66, #0D0D18)`;
    d.onclick = (e) => { e.stopPropagation(); st.bgIdx = i; render(); };
    el.appendChild(d);
  });
}

function populateColors() {
  const el = document.getElementById('ins-colors-container');
  if (!el) return;
  el.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = `ins-c ${c === st.color ? 'active' : ''}`;
    d.style.background = c;
    d.onclick = (e) => { e.stopPropagation(); st.color = c; render(); };
    el.appendChild(d);
  });
}

function bindSliders() {
  document.querySelectorAll('.ins-slider').forEach(row => {
    const inp = row.querySelector('input');
    const val = row.querySelector('.val');
    if (!inp || !val) return;
    inp.oninput = () => {
      const suffix = val.textContent.includes('°') ? '°' : (val.textContent.includes('%') ? '%' : '');
      val.textContent = inp.value + suffix;
    };
  });
}

// ─── Init ───────────────────────────────────────
render();
</script>
</body>
</html>
