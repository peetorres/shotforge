<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refine A: Inline Expand — No page change</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #18181b; --surface-2: #27272a; --surface-3: #3f3f46;
    --text: #fafafa; --text-2: #a1a1aa; --text-3: #52525b;
    --indigo: #6366f1; --purple: #8b5cf6; --green: #22c55e; --orange: #f59e0b;
    --red: #ef4444; --pink: #ec4899;
    --radius: 16px; --font: 'SF Pro Display', -apple-system, sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
  input, textarea, select { font-family: var(--font); outline: none; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
  @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* ─── Navbar ───────────────────────────────────── */
  .nav { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: rgba(9,9,11,0.9); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 24px; z-index: 300; }
  .nav-brand { font-size: 15px; font-weight: 800; background: linear-gradient(135deg, var(--indigo), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .nav-right { margin-left: auto; display: flex; gap: 8px; }
  .nav-btn { height: 32px; padding: 0 16px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .nav-btn.export { background: var(--green); color: #000; }
  .nav-btn.export:hover { background: #34d058; }

  /* ─── Results page with inline editing ─────────── */
  .page { padding: 80px 24px 40px; max-width: 1200px; margin: 0 auto; }
  .page-header { text-align: center; margin-bottom: 40px; animation: fadeUp 0.5s var(--ease); }
  .page-header h2 { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
  .page-header p { color: var(--text-2); font-size: 14px; }

  /* ─── Variant Section ──────────────────────────── */
  .variant { margin-bottom: 48px; }
  .v-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .v-name { font-size: 18px; font-weight: 800; }
  .v-pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px; }
  .v-pill.dark { background: rgba(99,102,241,0.15); color: var(--indigo); }
  .v-pill.light { background: rgba(34,197,94,0.15); color: var(--green); }
  .v-pill.vivid { background: rgba(245,158,11,0.15); color: var(--orange); }

  /* ─── Slides Strip ─────────────────────────────── */
  .strip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
  .slide { flex-shrink: 0; width: 170px; aspect-ratio: 1290/2796; border-radius: 14px; overflow: hidden; scroll-snap-align: start; position: relative; box-shadow: 0 8px 28px rgba(0,0,0,0.3); transition: all 0.35s var(--ease); cursor: pointer; }
  .slide:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 14px 40px rgba(0,0,0,0.4); }

  /* ─── EXPANDED STATE ───────────────────────────── */
  .slide.expanded {
    width: 320px; cursor: default; transform: none;
    box-shadow: 0 0 0 3px var(--indigo), 0 20px 60px rgba(99,102,241,0.15);
  }
  .slide.expanded:hover { transform: none; }
  .slide.not-expanded { opacity: 0.5; filter: blur(1px); pointer-events: none; }

  /* Slide content */
  .sc { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 13% 8% 0; position: relative; overflow: hidden; }
  .sc .hl { font-size: 10px; font-weight: 800; text-align: center; line-height: 1.2; margin-bottom: 5%; z-index: 2; }
  .slide.expanded .sc .hl { font-size: 18px; }
  .sc .dev { width: 56%; aspect-ratio: 9/19.5; border-radius: 8px; overflow: hidden; z-index: 2; box-shadow: 0 6px 20px rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.08); }
  .sc .dev img { width: 100%; height: 100%; object-fit: cover; }
  .sc .glow { position: absolute; width: 130%; height: 60%; bottom: -5%; left: -15%; border-radius: 50%; filter: blur(50px); opacity: 0.2; z-index: 1; }

  /* ─── Inline Editor Panel (appears below expanded slide) ── */
  .inline-editor {
    position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%);
    width: 360px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px; z-index: 200;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: scaleIn 0.25s var(--ease);
    display: none;
  }
  .slide.expanded .inline-editor { display: block; }

  .ie-close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); color: var(--text-3); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
  .ie-close:hover { background: var(--surface-3); color: var(--text); }

  .ie-section { margin-bottom: 16px; }
  .ie-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .ie-label .ai { font-size: 9px; padding: 2px 5px; background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15)); border: 1px solid rgba(99,102,241,0.25); border-radius: 4px; color: #818cf8; cursor: pointer; }

  .ie-input { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--text); transition: all 0.1s; }
  .ie-input:focus { border-color: var(--indigo); }

  .ie-bgs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .ie-bg { aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.1s; }
  .ie-bg:hover { transform: scale(1.06); }
  .ie-bg.active { border-color: #fff; }

  .ie-colors { display: flex; gap: 4px; }
  .ie-c { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.1s; }
  .ie-c:hover { transform: scale(1.1); }
  .ie-c.active { border-color: #fff; }

  .ie-row { display: flex; gap: 6px; }
  .ie-row select { flex: 1; background: var(--bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 8px; font-size: 12px; color: var(--text); appearance: none; }

  .ie-slider { display: flex; align-items: center; gap: 6px; }
  .ie-slider input[type="range"] { flex: 1; accent-color: var(--indigo); }
  .ie-slider .val { font-size: 10px; color: var(--text-3); min-width: 24px; text-align: right; font-family: monospace; }

  /* ─── Concept Label ────────────────────────────── */
  .concept-tag { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 20px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; font-size: 12px; color: var(--text-2); z-index: 100; display: flex; align-items: center; gap: 8px; }
  .concept-tag strong { color: var(--indigo); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">Shotforge</div>
  <div class="nav-right">
    <button class="nav-btn export">⬇ Export ZIP</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h2>Your screenshots are ready</h2>
    <p>Click any slide to edit it inline — no page change needed.</p>
  </div>

  <div id="variants"></div>
</div>

<div class="concept-tag">
  <strong>Concept A</strong> Inline Expand — click a slide to edit without leaving the gallery
</div>

<script>
const COLOR = '#6366f1';
const COLORS = ['#6366f1','#3b82f6','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#8b5cf6'];
const HEADLINES = ['Your app,\n**elevated**','**Smart** learning\nmade simple','Track your\n**progress**','AI-powered\n**insights**','Daily\n**challenges**','Join **thousands**'];
const VARIANTS = [
  { name: 'Midnight', pill: 'dark', bg: 'linear-gradient(160deg,#0D0D18,#1a1033)', text: '#fff' },
  { name: 'Clean', pill: 'light', bg: 'linear-gradient(160deg,#F5F5F7,#E8E8ED)', text: '#1d1d1f' },
  { name: 'Vivid', pill: 'vivid', bg: `linear-gradient(160deg,${COLOR}33,${COLOR}66,#0D0D18)`, text: '#fff' },
];
const BGS = [
  'linear-gradient(160deg,#0D0D18,#1a1033)',
  'linear-gradient(160deg,#F5F5F7,#E8E8ED)',
  `linear-gradient(160deg,${COLOR}33,${COLOR}66,#0D0D18)`,
  'linear-gradient(135deg,#667eea,#764ba2)',
  'linear-gradient(135deg,#f093fb,#f5576c)',
  'linear-gradient(135deg,#4facfe,#00f2fe)',
];
const PLACEHOLDERS = ['📊 Dashboard','🏠 Home','👤 Profile','⚡ Feature','📱 Feed','🎯 Onboard'];

function hl(text) {
  return text.replace(/\*\*(.+?)\*\*/g, `<span style="color:${COLOR}">$1</span>`).replace(/\n/g, '<br>');
}

let expandedSlide = null;

function renderAll() {
  const container = document.getElementById('variants');
  container.innerHTML = '';

  VARIANTS.forEach((v, vi) => {
    const section = document.createElement('div');
    section.className = 'variant';
    section.innerHTML = `
      <div class="v-header">
        <div class="v-name">${v.name}</div>
        <div class="v-pill ${v.pill}">${v.name}</div>
      </div>
      <div class="strip" id="strip-${vi}"></div>
    `;
    container.appendChild(section);

    const strip = section.querySelector('.strip');
    for (let si = 0; si < 6; si++) {
      const id = `slide-${vi}-${si}`;
      const isExpanded = expandedSlide === id;
      const hasExpanded = expandedSlide && expandedSlide.startsWith(`slide-${vi}-`);

      const slide = document.createElement('div');
      slide.className = `slide ${isExpanded ? 'expanded' : ''} ${hasExpanded && !isExpanded ? 'not-expanded' : ''}`;
      slide.id = id;
      slide.style.background = v.bg;
      slide.style.position = 'relative';
      slide.style.overflow = 'visible';

      slide.innerHTML = `
        <div class="sc" style="border-radius:14px; overflow:hidden; position:relative; width:100%; height:100%;">
          <div class="hl" style="color:${v.text}">${hl(HEADLINES[si])}</div>
          <div class="dev">
            <div style="width:100%;height:100%;background:${v.text === '#fff' ? '#1c1c1e' : '#e5e5ea'};display:flex;align-items:center;justify-content:center;font-size:${isExpanded ? '16px' : '10px'};color:${v.text === '#fff' ? '#666' : '#999'}">${PLACEHOLDERS[si]}</div>
          </div>
          <div class="glow" style="background:${COLOR}"></div>
        </div>
        ${isExpanded ? `
          <div class="inline-editor" style="display:block">
            <button class="ie-close" onclick="collapseSlide(event)">✕</button>
            <div class="ie-section">
              <div class="ie-label">Headline <span class="ai">✦ AI</span></div>
              <textarea class="ie-input" rows="2" style="resize:none">${HEADLINES[si].replace(/\*\*/g, '')}</textarea>
            </div>
            <div class="ie-section">
              <div class="ie-label">Background</div>
              <div class="ie-bgs">
                ${BGS.map((bg, bi) => `<div class="ie-bg ${bi === vi ? 'active' : ''}" style="background:${bg}"></div>`).join('')}
              </div>
            </div>
            <div class="ie-section">
              <div class="ie-label">Accent Color</div>
              <div class="ie-colors">
                ${COLORS.map(c => `<div class="ie-c ${c === COLOR ? 'active' : ''}" style="background:${c}"></div>`).join('')}
              </div>
            </div>
            <div class="ie-section">
              <div class="ie-label">Font</div>
              <div class="ie-row">
                <select><option>SF Pro Display</option><option selected>Inter</option><option>Poppins</option><option>Space Grotesk</option></select>
              </div>
            </div>
            <div class="ie-section">
              <div class="ie-label">Device Rotation</div>
              <div class="ie-slider"><input type="range" min="-20" max="20" value="0" /><span class="val">0°</span></div>
            </div>
          </div>
        ` : ''}
      `;

      if (!isExpanded) {
        slide.onclick = () => { expandedSlide = id; renderAll(); };
      }
      strip.appendChild(slide);
    }
  });
}

function collapseSlide(e) {
  e.stopPropagation();
  expandedSlide = null;
  renderAll();
}

renderAll();
</script>
</body>
</html>
