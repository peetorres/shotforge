<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refine B: Focus Mode — Full-screen immersive</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #18181b; --surface-2: #27272a; --surface-3: #3f3f46;
    --text: #fafafa; --text-2: #a1a1aa; --text-3: #52525b;
    --indigo: #6366f1; --purple: #8b5cf6; --green: #22c55e; --orange: #f59e0b;
    --red: #ef4444; --pink: #ec4899;
    --font: 'SF Pro Display', -apple-system, sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
  input, textarea, select { font-family: var(--font); outline: none; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* ─── Full screen layout ───────────────────────── */
  .app { height: 100vh; display: grid; grid-template-rows: 52px 1fr auto; overflow: hidden; }

  /* ─── Top Bar ──────────────────────────────────── */
  .topbar { background: rgba(9,9,11,0.9); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 10; }
  .topbar-brand { font-size: 15px; font-weight: 800; background: linear-gradient(135deg, var(--indigo), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .topbar-back { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .topbar-back:hover { background: var(--surface-2); color: var(--text); }
  .topbar-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .topbar-slide-label { font-size: 13px; font-weight: 600; }
  .topbar-counter { font-size: 12px; color: var(--text-3); }
  .topbar-right { display: flex; gap: 8px; }
  .topbar-btn { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .topbar-btn.export { background: var(--green); color: #000; }

  /* ─── Canvas Area ──────────────────────────────── */
  .canvas { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: radial-gradient(ellipse at center, rgba(255,255,255,0.01) 0%, transparent 70%); }

  /* Arrow navigation */
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.06); backdrop-filter: blur(12px); color: var(--text-2); font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 10; transition: all 0.15s var(--ease); }
  .arrow:hover { background: rgba(255,255,255,0.12); color: var(--text); transform: translateY(-50%) scale(1.05); }
  .arrow.left { left: 24px; }
  .arrow.right { right: 24px; }

  /* Main slide preview */
  .main-slide { height: 75vh; max-height: 640px; aspect-ratio: 1290/2796; border-radius: 32px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 40px 100px rgba(0,0,0,0.5); transition: all 0.4s var(--ease); }
  .ms-inner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 12% 10% 0; position: relative; overflow: hidden; }
  .ms-inner .ms-hl { font-size: 22px; font-weight: 800; text-align: center; line-height: 1.15; letter-spacing: -0.5px; margin-bottom: 5%; z-index: 2; transition: all 0.3s; }
  .ms-inner .ms-dev { width: 55%; aspect-ratio: 9/19.5; border-radius: 14px; overflow: hidden; z-index: 2; box-shadow: 0 8px 36px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.08); }
  .ms-inner .ms-dev div { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .ms-inner .ms-glow { position: absolute; width: 140%; height: 65%; bottom: -5%; left: -20%; border-radius: 50%; filter: blur(60px); opacity: 0.2; z-index: 1; }

  /* ─── Filmstrip (bottom thumbnails) ────────────── */
  .filmstrip-bar { background: var(--surface); border-top: 1px solid rgba(255,255,255,0.06); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .filmstrip { display: flex; gap: 8px; flex: 1; justify-content: center; }
  .fs-thumb { width: 44px; aspect-ratio: 9/19.5; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: all 0.15s var(--ease); opacity: 0.5; }
  .fs-thumb:hover { opacity: 0.8; }
  .fs-thumb.active { border-color: var(--indigo); opacity: 1; box-shadow: 0 0 12px rgba(99,102,241,0.3); }
  .fs-thumb-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--text-3); }

  /* ─── Bottom Drawer (pull-up controls) ─────────── */
  .drawer-toggle { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 6px 20px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--text-2); z-index: 20; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
  .drawer-toggle:hover { background: var(--surface-2); color: var(--text); }
  .drawer-toggle .chevron { transition: transform 0.2s; }
  .drawer-toggle.open .chevron { transform: rotate(180deg); }

  .drawer { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.08); border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform 0.35s var(--ease); z-index: 15; max-height: 50vh; overflow-y: auto; }
  .drawer.open { transform: translateY(0); }
  .drawer-handle { width: 36px; height: 4px; background: var(--surface-3); border-radius: 2px; margin: 10px auto; }
  .drawer-content { padding: 8px 24px 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  .dc-section { }
  .dc-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .dc-title .ai { font-size: 9px; padding: 1px 5px; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.25); border-radius: 4px; color: #818cf8; cursor: pointer; }

  .dc-inp { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .dc-inp:focus { border-color: var(--indigo); }

  .dc-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .dc-bg { aspect-ratio: 1; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: all 0.1s; }
  .dc-bg:hover { transform: scale(1.06); }
  .dc-bg.active { border-color: #fff; }

  .dc-colors { display: flex; gap: 4px; flex-wrap: wrap; }
  .dc-c { width: 20px; height: 20px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: all 0.1s; }
  .dc-c:hover { transform: scale(1.1); }
  .dc-c.active { border-color: #fff; }

  .dc-select { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 8px; font-size: 12px; color: var(--text); appearance: none; }

  .dc-slider { display: flex; align-items: center; gap: 6px; }
  .dc-slider input { flex: 1; accent-color: var(--indigo); }
  .dc-slider .val { font-size: 10px; color: var(--text-3); min-width: 24px; text-align: right; font-family: monospace; }

  .dc-layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .dc-lo { aspect-ratio: 9/19.5; background: var(--surface-2); border: 1.5px solid transparent; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: all 0.1s; }
  .dc-lo:hover { background: var(--surface-3); }
  .dc-lo.active { border-color: var(--indigo); }
  .dc-lo-icon { font-size: 8px; }
  .dc-lo-label { font-size: 6px; color: var(--text-3); font-weight: 700; }

  /* Concept tag */
  .concept-tag { position: fixed; top: 60px; right: 20px; padding: 6px 14px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 11px; color: var(--text-2); z-index: 100; }
  .concept-tag strong { color: var(--indigo); }
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">Shotforge</div>
    <button class="topbar-back">← Variants</button>
    <div class="topbar-center">
      <span class="topbar-slide-label" id="slide-label">Hero</span>
      <span class="topbar-counter" id="slide-counter">1 / 6</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn export">⬇ Export</button>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas" id="canvas-area">
    <button class="arrow left" id="arrow-left">‹</button>
    <button class="arrow right" id="arrow-right">›</button>

    <div class="main-slide" id="main-slide"></div>

    <button class="drawer-toggle" id="drawer-toggle" onclick="toggleDrawer()">
      <span>✎ Edit this slide</span>
      <span class="chevron">▲</span>
    </button>

    <!-- Drawer -->
    <div class="drawer" id="drawer">
      <div class="drawer-handle"></div>
      <div class="drawer-content">
        <!-- Col 1: Copy + Layout -->
        <div>
          <div class="dc-section">
            <div class="dc-title">Layout</div>
            <div class="dc-layouts">
              <div class="dc-lo active"><div class="dc-lo-icon">🏆</div><div class="dc-lo-label">HERO</div></div>
              <div class="dc-lo"><div class="dc-lo-icon">📱</div><div class="dc-lo-label">SINGLE</div></div>
              <div class="dc-lo"><div class="dc-lo-icon">📱📱</div><div class="dc-lo-label">DUAL</div></div>
              <div class="dc-lo"><div class="dc-lo-icon">📊</div><div class="dc-lo-label">STATS</div></div>
            </div>
          </div>
          <div class="dc-section" style="margin-top:12px">
            <div class="dc-title">Copy <span class="ai">✦ AI</span></div>
            <textarea class="dc-inp" rows="2" style="resize:none" id="dc-headline"></textarea>
            <input class="dc-inp" placeholder="Subtitle (optional)" />
          </div>
        </div>

        <!-- Col 2: Background + Color -->
        <div>
          <div class="dc-section">
            <div class="dc-title">Background</div>
            <div class="dc-bgs" id="dc-bgs"></div>
          </div>
          <div class="dc-section" style="margin-top:12px">
            <div class="dc-title">Brand Color</div>
            <div class="dc-colors" id="dc-colors"></div>
          </div>
        </div>

        <!-- Col 3: Font + Device -->
        <div>
          <div class="dc-section">
            <div class="dc-title">Font</div>
            <select class="dc-select"><option>SF Pro Display</option><option selected>Inter</option><option>Poppins</option><option>Space Grotesk</option></select>
          </div>
          <div class="dc-section" style="margin-top:12px">
            <div class="dc-title">Rotation</div>
            <div class="dc-slider"><input type="range" min="-20" max="20" value="0" /><span class="val">0°</span></div>
          </div>
          <div class="dc-section" style="margin-top:8px">
            <div class="dc-title">Scale</div>
            <div class="dc-slider"><input type="range" min="50" max="120" value="100" /><span class="val">100%</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filmstrip -->
  <div class="filmstrip-bar">
    <div class="filmstrip" id="filmstrip"></div>
  </div>
</div>

<div class="concept-tag"><strong>Concept B</strong> Focus Mode — full-screen, one slide, bottom drawer</div>

<script>
const COLOR = '#6366f1';
const COLORS = ['#6366f1','#3b82f6','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#8b5cf6'];
const HEADLINES = ['Your app,\n**elevated**','**Smart** learning\nmade simple','Track your\n**progress**','AI-powered\n**insights**','Daily\n**challenges**','Join **thousands**'];
const TYPES = ['Hero','Feature','Feature','Feature','Feature','Social'];
const PLACEHOLDERS = ['📊','🏠','👤','⚡','📱','🎯'];
const BGS = [
  'linear-gradient(160deg,#0D0D18,#1a1033)',
  'linear-gradient(160deg,#F5F5F7,#E8E8ED)',
  `linear-gradient(160deg,${COLOR}33,${COLOR}66,#0D0D18)`,
  'linear-gradient(135deg,#667eea,#764ba2)',
  'linear-gradient(135deg,#f093fb,#f5576c)',
  'linear-gradient(135deg,#4facfe,#00f2fe)',
  'linear-gradient(135deg,#43e97b,#38f9d7)',
  'linear-gradient(160deg,#000,#0a0a1a)',
];

let current = 0;
let drawerOpen = false;
let currentBg = BGS[0];
let currentTextColor = '#fff';

function hl(text) {
  return text.replace(/\*\*(.+?)\*\*/g, `<span style="color:${COLOR}">$1</span>`).replace(/\n/g, '<br>');
}

function render() {
  // Main slide
  const slide = document.getElementById('main-slide');
  slide.style.background = currentBg;
  const mockBg = currentTextColor === '#fff' ? '#1c1c1e' : '#e5e5ea';
  const mockC = currentTextColor === '#fff' ? '#555' : '#999';
  slide.innerHTML = `
    <div class="ms-inner">
      <div class="ms-hl" style="color:${currentTextColor}">${hl(HEADLINES[current])}</div>
      <div class="ms-dev"><div style="background:${mockBg};color:${mockC}">${PLACEHOLDERS[current]}</div></div>
      <div class="ms-glow" style="background:${COLOR}"></div>
    </div>
  `;

  // Labels
  document.getElementById('slide-label').textContent = TYPES[current];
  document.getElementById('slide-counter').textContent = `${current + 1} / 6`;
  document.getElementById('dc-headline').value = HEADLINES[current].replace(/\*\*/g, '');

  // Filmstrip
  const fs = document.getElementById('filmstrip');
  fs.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const t = document.createElement('div');
    t.className = `fs-thumb ${i === current ? 'active' : ''}`;
    t.style.background = currentBg;
    t.onclick = () => { current = i; render(); };
    t.innerHTML = `<div class="fs-thumb-inner">${PLACEHOLDERS[i]}</div>`;
    fs.appendChild(t);
  }
}

// Navigation
document.getElementById('arrow-left').onclick = () => { current = Math.max(0, current - 1); render(); };
document.getElementById('arrow-right').onclick = () => { current = Math.min(5, current + 1); render(); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { current = Math.max(0, current - 1); render(); }
  if (e.key === 'ArrowRight') { current = Math.min(5, current + 1); render(); }
});

// Drawer
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('drawer').classList.toggle('open', drawerOpen);
  document.getElementById('drawer-toggle').classList.toggle('open', drawerOpen);
  document.getElementById('drawer-toggle').querySelector('span:first-child').textContent = drawerOpen ? '✎ Close editor' : '✎ Edit this slide';
}

// Background presets
const bgsEl = document.getElementById('dc-bgs');
BGS.forEach((bg, i) => {
  const d = document.createElement('div');
  d.className = `dc-bg ${i === 0 ? 'active' : ''}`;
  d.style.background = bg;
  d.onclick = () => {
    currentBg = bg;
    currentTextColor = (i === 1) ? '#1d1d1f' : '#fff';
    document.querySelectorAll('.dc-bg').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    render();
  };
  bgsEl.appendChild(d);
});

// Color presets
const colorsEl = document.getElementById('dc-colors');
COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = `dc-c ${c === COLOR ? 'active' : ''}`;
  d.style.background = c;
  d.onclick = () => { document.querySelectorAll('.dc-c').forEach(x => x.classList.remove('active')); d.classList.add('active'); };
  colorsEl.appendChild(d);
});

// Sliders
document.querySelectorAll('.dc-slider').forEach(row => {
  const inp = row.querySelector('input');
  const val = row.querySelector('.val');
  inp.addEventListener('input', () => { val.textContent = inp.value + (val.textContent.includes('°') ? '°' : '%'); });
});

render();
</script>
</body>
</html>
