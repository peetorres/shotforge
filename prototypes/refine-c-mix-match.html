<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refine C: Mix & Match — Cherry-pick per slide</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #18181b; --surface-2: #27272a; --surface-3: #3f3f46;
    --text: #fafafa; --text-2: #a1a1aa; --text-3: #52525b;
    --indigo: #6366f1; --purple: #8b5cf6; --green: #22c55e; --orange: #f59e0b;
    --red: #ef4444; --pink: #ec4899; --blue: #3b82f6; --cyan: #06b6d4;
    --font: 'SF Pro Display', -apple-system, sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
  input, textarea, select { font-family: var(--font); outline: none; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes checkPop { 0% { transform: scale(0); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* ─── Layout ───────────────────────────────────── */
  .app { height: 100vh; display: grid; grid-template-rows: 52px 1fr 80px; overflow: hidden; }

  /* ─── Top Bar ──────────────────────────────────── */
  .topbar { background: rgba(9,9,11,0.9); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  .tb-brand { font-size: 15px; font-weight: 800; background: linear-gradient(135deg, var(--indigo), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tb-back { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .tb-back:hover { background: var(--surface-2); color: var(--text); }
  .tb-center { flex: 1; text-align: center; }
  .tb-title { font-size: 14px; font-weight: 700; }
  .tb-sub { font-size: 11px; color: var(--text-3); }
  .tb-right { display: flex; gap: 8px; }
  .tb-btn { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .tb-btn.export { background: var(--green); color: #000; }

  /* ─── Main Content: Slide-by-slide comparison ──── */
  .content { overflow-y: auto; padding: 24px; }

  /* Slide Row = one slide position, 3 variant options side by side */
  .slide-row { margin-bottom: 32px; animation: fadeUp 0.4s var(--ease) both; }
  .sr-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-left: 4px; }
  .sr-num { width: 28px; height: 28px; border-radius: 8px; background: var(--surface); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
  .sr-type { font-size: 13px; font-weight: 700; }
  .sr-headline { font-size: 12px; color: var(--text-3); margin-left: 4px; }

  .sr-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .option-card { position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; border: 2.5px solid transparent; transition: all 0.2s var(--ease); }
  .option-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .option-card.selected { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(99,102,241,0.15), 0 12px 40px rgba(99,102,241,0.1); }

  /* Variant label */
  .option-label { position: absolute; top: 8px; left: 8px; z-index: 5; padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 700; letter-spacing: 0.3px; backdrop-filter: blur(8px); }
  .option-label.dark { background: rgba(99,102,241,0.2); color: #818cf8; }
  .option-label.light { background: rgba(34,197,94,0.2); color: var(--green); }
  .option-label.vivid { background: rgba(245,158,11,0.2); color: var(--orange); }

  /* Check mark */
  .option-check { position: absolute; top: 8px; right: 8px; z-index: 5; width: 24px; height: 24px; border-radius: 50%; background: var(--indigo); color: #fff; font-size: 12px; font-weight: 800; display: none; align-items: center; justify-content: center; }
  .option-card.selected .option-check { display: flex; animation: checkPop 0.3s var(--ease); }

  /* Slide preview */
  .option-preview { aspect-ratio: 1290/2796; overflow: hidden; }
  .op-inner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 13% 8% 0; position: relative; overflow: hidden; }
  .op-inner .op-hl { font-size: 11px; font-weight: 800; text-align: center; line-height: 1.2; margin-bottom: 5%; z-index: 2; }
  .op-inner .op-dev { width: 56%; aspect-ratio: 9/19.5; border-radius: 8px; overflow: hidden; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.08); }
  .op-inner .op-dev div { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .op-inner .op-glow { position: absolute; width: 130%; height: 60%; bottom: -5%; left: -15%; border-radius: 50%; filter: blur(40px); opacity: 0.2; z-index: 1; }

  /* ─── Bottom Bar: Final Set Preview ────────────── */
  .bottom-bar { background: var(--surface); border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  .bb-label { font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .bb-label strong { color: var(--text); }

  .bb-strip { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 8px 0; }
  .bb-mini { width: 32px; aspect-ratio: 9/19.5; border-radius: 4px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.08); flex-shrink: 0; position: relative; }
  .bb-mini .variant-dot { position: absolute; bottom: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; }

  .bb-export { height: 40px; padding: 0 24px; border-radius: 10px; font-size: 14px; font-weight: 700; background: var(--green); color: #000; display: flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; }
  .bb-export:hover { background: #34d058; }
  .bb-export:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }

  /* Concept tag */
  .concept-tag { position: fixed; top: 60px; right: 16px; padding: 5px 12px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 11px; color: var(--text-2); z-index: 100; }
  .concept-tag strong { color: var(--indigo); }
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="tb-brand">Shotforge</div>
    <button class="tb-back">← Variants</button>
    <div class="tb-center">
      <div class="tb-title">Mix & Match</div>
      <div class="tb-sub">Pick the best variant for each slide</div>
    </div>
    <div class="tb-right">
      <button class="tb-btn export">⬇ Export</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content" id="content"></div>

  <!-- Bottom Bar: Final set preview -->
  <div class="bottom-bar">
    <div class="bb-label">Your set: <strong id="bb-count">0</strong>/6 picked</div>
    <div class="bb-strip" id="bb-strip"></div>
    <button class="bb-export" id="bb-export" disabled>⬇ Export Final Set</button>
  </div>
</div>

<div class="concept-tag"><strong>Concept C</strong> Mix & Match — cherry-pick per slide</div>

<script>
const COLOR = '#6366f1';
const COLORS_MAP = { dark: '#6366f1', light: '#22c55e', vivid: '#f59e0b' };
const HEADLINES = ['Your app,\n**elevated**','**Smart** learning\nmade simple','Track your\n**progress**','AI-powered\n**insights**','Daily\n**challenges**','Join **thousands**'];
const TYPES = ['Hero','Feature','Feature','Feature','Feature','Social'];
const PLACEHOLDERS = ['📊 Dashboard','🏠 Home','👤 Profile','⚡ Feature','📱 Feed','🎯 Onboard'];
const VARIANTS = [
  { name: 'Midnight', cls: 'dark', bg: 'linear-gradient(160deg,#0D0D18,#1a1033)', text: '#fff', mock: '#1c1c1e', mockC: '#555' },
  { name: 'Clean', cls: 'light', bg: 'linear-gradient(160deg,#F5F5F7,#E8E8ED)', text: '#1d1d1f', mock: '#e5e5ea', mockC: '#999' },
  { name: 'Vivid', cls: 'vivid', bg: `linear-gradient(160deg,${COLOR}33,${COLOR}66,#0D0D18)`, text: '#fff', mock: '#1c1c1e', mockC: '#555' },
];

// Track selections per slide: null or variant index
let selections = [null, null, null, null, null, null];

function hl(text) {
  return text.replace(/\*\*(.+?)\*\*/g, `<span style="color:${COLOR}">$1</span>`).replace(/\n/g, '<br>');
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  for (let si = 0; si < 6; si++) {
    const row = document.createElement('div');
    row.className = 'slide-row';
    row.style.animationDelay = `${si * 0.05}s`;

    const headlineClean = HEADLINES[si].replace(/\*\*/g, '').replace('\n', ' ');
    row.innerHTML = `
      <div class="sr-header">
        <div class="sr-num">${si + 1}</div>
        <div class="sr-type">${TYPES[si]}</div>
        <div class="sr-headline">${headlineClean}</div>
      </div>
      <div class="sr-options">
        ${VARIANTS.map((v, vi) => {
          const isSelected = selections[si] === vi;
          return `
            <div class="option-card ${isSelected ? 'selected' : ''}" onclick="select(${si}, ${vi})">
              <div class="option-label ${v.cls}">${v.name}</div>
              <div class="option-check">✓</div>
              <div class="option-preview" style="background:${v.bg}">
                <div class="op-inner">
                  <div class="op-hl" style="color:${v.text}">${hl(HEADLINES[si])}</div>
                  <div class="op-dev"><div style="background:${v.mock};color:${v.mockC}">${PLACEHOLDERS[si]}</div></div>
                  <div class="op-glow" style="background:${COLOR}"></div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    content.appendChild(row);
  }

  renderBottomBar();
}

function select(slideIdx, variantIdx) {
  // Toggle: if already selected, deselect
  selections[slideIdx] = selections[slideIdx] === variantIdx ? null : variantIdx;
  render();
}

function renderBottomBar() {
  const count = selections.filter(s => s !== null).length;
  document.getElementById('bb-count').textContent = count;
  document.getElementById('bb-export').disabled = count < 6;

  const strip = document.getElementById('bb-strip');
  strip.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const mini = document.createElement('div');
    mini.className = 'bb-mini';
    if (selections[i] !== null) {
      const v = VARIANTS[selections[i]];
      mini.style.background = v.bg;
      mini.innerHTML = `
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6px;color:${v.mockC}">${PLACEHOLDERS[i].split(' ')[0]}</div>
        <div class="variant-dot" style="background:${COLORS_MAP[v.cls]}"></div>
      `;
    } else {
      mini.style.background = 'var(--surface-2)';
      mini.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-3)">${i + 1}</div>`;
    }
    strip.appendChild(mini);
  }
}

// Quick select all of one variant
function selectAll(vi) {
  selections = selections.map(() => vi);
  render();
}

render();
</script>
</body>
</html>
